services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    command: php -S 0.0.0.0:8000 -t public public/index.php
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
