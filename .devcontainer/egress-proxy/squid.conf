# Egress allowlist proxy dla php-devcontainer-starter.
#
# `app`/`nginx` siedza na frontend-net, ktora jest `internal: true` (brak trasy do WAN).
# Ten proxy to jedyny serwis z realnym dostepem do internetu (siec egress-net). `app` dostaje
# HTTP_PROXY/HTTPS_PROXY wskazujace tutaj - narzedzia ktore honoruja te zmienne (curl, Guzzle,
# composer, npm, git po HTTPS, Claude Code CLI) przejda przez allowlist ponizej. Filtr jest po
# dstdomain (nazwa hosta z CONNECT), nie po IP - odporny na rotacje IP CDN-ow.
#
# TO JEST TEMPLATE, GENERYCZNY - allowlista zawiera TYLKO to, co potrzebne do samego
# devcontainera (GitHub/Packagist/Anthropic). Kazdy prawdziwy projekt zbudowany na tym
# starterze MUSI dopisac wlasne hosty API tutaj, swiadomie, jeden po drugim. Nie dodawaj
# hostow "na zapas" - to jest tez mechanizm honeypota (zobacz canary/README): jesli agent AI
# probuje faktycznie uzyc fejkowych danych w canary/, taka proba zostanie zablokowana i
# zalogowana wlasnie dlatego, ze te hosty NIE sa tu wpisane.
#
# Zeby dopisac nowy dozwolony host: dodaj linie `acl allowlist dstdomain <host>` nizej
# i przebuduj serwis (`docker compose build egress-proxy && docker compose up -d`).

http_port 3128

# Kontener dziala jako non-root user `squid` (Dockerfile: USER squid) - /var/run
# nalezy do roota i nie jest zapisywalny, wiec PID/cache trzymamy w /tmp.
pid_filename /tmp/squid.pid

acl allowed_connect_ports port 443

# --- allowlist domen (generyczne minimum devcontainera) ---
# GitHub - git (po HTTPS), gh CLI, releases (lazygit itp.)
acl allowlist dstdomain github.com
acl allowlist dstdomain api.github.com
acl allowlist dstdomain codeload.github.com
acl allowlist dstdomain objects.githubusercontent.com
acl allowlist dstdomain raw.githubusercontent.com

# Composer / Packagist
acl allowlist dstdomain packagist.org
acl allowlist dstdomain repo.packagist.org
acl allowlist dstdomain getcomposer.org

# Claude Code CLI (samo narzedzie AI dziala w tym kontenerze)
acl allowlist dstdomain api.anthropic.com

http_access deny CONNECT !allowed_connect_ports
http_access allow CONNECT allowlist
http_access deny CONNECT
http_access allow allowlist
http_access deny all

cache deny all
# stdout, nie plik - `docker compose logs egress-proxy` / scripts/check-canary-hits.sh
# musza to widziec bez wchodzenia do kontenera. Squid pisze bezposrednio do deskryptora
# stdout procesu (PID1), wiec Docker to przechwytuje jak kazdy inny log kontenera.
access_log stdio:/dev/stdout