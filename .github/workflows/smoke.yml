name: Smoke Test

on:
  push:
    branches: [main, vanilla, slim, symfony]
  pull_request:
    branches: [main, vanilla, slim, symfony]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build containers
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Show container status
        run: docker compose ps

      - name: Composer install
        run: docker compose exec -T app composer install --no-interaction --prefer-dist

      - name: Composer diagnose
        run: docker compose exec -T app composer diagnose || true

      - name: Check PHP modules
        run: docker compose exec -T app php -m | grep -E "xdebug|PDO|pdo_sqlite|intl|zip|Zend OPcache"

      - name: Sprawdz czy strona faktycznie sie wyswietla (HTTP smoke check)
        run: |
          curl -sf --retry 5 --retry-delay 1 --retry-connrefused http://localhost:8000/ \
            | grep -q "It works. Symfony starter" || { echo "::error::/ nie zawiera oczekiwanego tekstu (It works. Symfony starter)"; exit 1; }
          curl -sf --retry 5 --retry-delay 1 --retry-connrefused http://localhost:8000/health \
            | grep -q '"status":"ok"' || { echo "::error::/health nie zwrocil oczekiwanego JSON-a"; exit 1; }

      - name: Run PHPUnit
        run: docker compose exec -T app vendor/bin/phpunit

      - name: Run PHPStan
        run: docker compose exec -T app vendor/bin/phpstan analyse

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down -v